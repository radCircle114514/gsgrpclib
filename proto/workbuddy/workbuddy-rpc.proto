syntax = "proto3";
import "proto/any.proto";
option go_package = "github.com/iznilul/workbuddy_rpc";

package wbrpc;

// Interface exported by the server.
service WorkBuddyRPC {
  // 监控指标 Metrics
  rpc GetMetrics(RequestAO) returns (ResponseVO);
  rpc GetMetricsDownloadURL(RequestAO) returns (ResponseVO);
  rpc GetMetricsDownloadURLV2(RequestAO) returns (ResponseVO);
  rpc GetActivityAnalytics(RequestAO) returns (ResponseVO);
  rpc GetDialogAnalytics(RequestAO) returns (ResponseVO);
  rpc GetCompletionAnalytics(RequestAO) returns (ResponseVO);
  rpc GetGenerationAnalytics(RequestAO) returns (ResponseVO);
  rpc GetMemberData(RequestAO) returns (ResponseVO);

  // 用量管理 Usage
  rpc GetQuotaCycle(RequestAO) returns (ResponseVO);
  rpc GetDefaultQuota(RequestAO) returns (ResponseVO);
  rpc UpdateDefaultQuota(RequestAO) returns (ResponseVO);
  rpc QueryMemberUsage(RequestAO) returns (ResponseVO);
  rpc QueryMemberLimit(RequestAO) returns (ResponseVO);
  rpc UpdateMemberQuota(RequestAO) returns (ResponseVO);
  rpc UpdateDepartmentQuota(RequestAO) returns (ResponseVO);
  rpc GetUsageMemberDetail(RequestAO) returns (ResponseVO);
}

message RequestAO {
  google.protobuf.Any data = 1;
  repeated google.protobuf.Any dataList = 2;
  google.protobuf.Any map = 3;
  repeated google.protobuf.Any mapList = 4;
}

message ResponseVO {
  int32 code = 1;
  string msg = 2;
  google.protobuf.Any data = 3;
  repeated google.protobuf.Any dataList = 4;
  google.protobuf.Any map = 5;
  repeated google.protobuf.Any mapList = 6;
}
