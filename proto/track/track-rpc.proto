//edition = "2023";
syntax = "proto3";
import "proto/any.proto";
//option features.field_presence = IMPLICIT;
option go_package = "github.com/iznilul/track_rpc";
//option java_multiple_files = true;
//option java_package = "io.grpc.examples.routeguide";
//option java_outer_classname = "RouteGuideProto";
//protoc  --go_out=. --go_opt=paths=source_relative     --go-grpc_out=. --go-grpc_opt=paths=source_relative     proto/track/track-rpc.proto

package trpc;

// Interface exported by the server.
service TrackRPC {
  // Basic Query (shared generic data-query surface)
  rpc QueryFieldList (RequestAO) returns (ResponseVO) {}

  // WCW (物畅网) station & track lifecycle
  rpc FindWcwStationList (RequestAO) returns (ResponseVO) {}
  rpc SendWcwSyncRequest (RequestAO) returns (ResponseVO) {}
  rpc FindWcwOngoingTrackList (RequestAO) returns (ResponseVO) {}
  rpc FindWcwHistoryTrackList (RequestAO) returns (ResponseVO) {}
  rpc FinishWcwTrack (RequestAO) returns (ResponseVO) {}
  rpc SyncWcwTrack (RequestAO) returns (ResponseVO) {}

  // WCW content query
  rpc FindWcwContentNoListBySerialNumberList (RequestAO) returns (ResponseVO) {}

  // Time Scope Query (shared generic data-query surface)
  rpc QueryDataInTimeScope(RequestAO) returns (ResponseVO) {}

  // Tujun (途君 GPS) device subscription
  rpc SubscribeTujun (RequestAO) returns (ResponseVO) {}

  // Tujun location lifecycle and lookup
  // FinishTujunLocation stops syncing one device (sn) and moves its subscribe
  // record and stored location points into the history tables.
  rpc FinishTujunLocation (RequestAO) returns (ResponseVO) {}
  // FindTujunLocationList returns stored location points for one sn (mode:
  // ongoing -> live table, history -> history table).
  rpc FindTujunLocationList (RequestAO) returns (ResponseVO) {}
  // SyncTujunLocation manually triggers a single-device location pull.
  rpc SyncTujunLocation (RequestAO) returns (ResponseVO) {}
  // FindTujunUnsubscribedDevices returns active devices that have no live
  // subscribe record, optionally filtered by a sn substring.
  rpc FindTujunUnsubscribedDevices (RequestAO) returns (ResponseVO) {}
  // FindTujunSubscribedDevices returns live subscribed devices that drive the
  // business "途骏-定位" tab SN search, optionally filtered by a sn substring.
  rpc FindTujunSubscribedDevices (RequestAO) returns (ResponseVO) {}
  // FindTujunHistorySubscribedDevices returns archived (finished) subscribed
  // devices that drive the business "途骏-历史定位" tab SN search.
  rpc FindTujunHistorySubscribedDevices (RequestAO) returns (ResponseVO) {}
}

message NoParam {
}

message RequestAO {
  google.protobuf.Any data = 1;
  repeated google.protobuf.Any dataList = 2;
  google.protobuf.Any map = 3;
  repeated google.protobuf.Any mapList = 4;
}

message ResponseVO {
  int32 code = 1;
  string msg = 2;
  //  google.protobuf.Any data = 3;
  google.protobuf.Any data = 3;
  repeated google.protobuf.Any dataList = 4;
  google.protobuf.Any map = 5;
  repeated google.protobuf.Any mapList = 6;
}

message KeyValue {
  string key = 1;
  google.protobuf.Any value = 2;
}