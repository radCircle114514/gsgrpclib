syntax = "proto3";
import "proto/any.proto";
option go_package = "github.com/iznilul/worktool_rpc";

package wtrpc;

service WorkToolRPC {
  rpc SendTextMessage(RequestAO) returns (ResponseVO);
  rpc AddCustomer(RequestAO) returns (ResponseVO);
  rpc UpdateCustomerRemark(RequestAO) returns (ResponseVO);
  rpc QueryCommandResults(RequestAO) returns (ResponseVO);
  rpc QueryCommandResultByMessageID(RequestAO) returns (ResponseVO);
  rpc SyncCommandResults(RequestAO) returns (ResponseVO);
  rpc SaveCommandResults(RequestAO) returns (ResponseVO);
  rpc ListPendingResults(RequestAO) returns (ResponseVO);
  rpc ClearReplyNumber(RequestAO) returns (ResponseVO);
  rpc ReceiveCallback(RequestAO) returns (ResponseVO);
  rpc ReceiveResultCallback(RequestAO) returns (ResponseVO);
  rpc ReceiveOnlineCallback(RequestAO) returns (ResponseVO);
  rpc ReceiveOfflineCallback(RequestAO) returns (ResponseVO);
}

message RequestAO {
  google.protobuf.Any data = 1;
  repeated google.protobuf.Any dataList = 2;
  google.protobuf.Any map = 3;
  repeated google.protobuf.Any mapList = 4;
}

message ResponseVO {
  int32 code = 1;
  string msg = 2;
  google.protobuf.Any data = 3;
  repeated google.protobuf.Any dataList = 4;
  google.protobuf.Any map = 5;
  repeated google.protobuf.Any mapList = 6;
}
