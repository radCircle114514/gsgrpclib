syntax = "proto3";
import "proto/any.proto";
option go_package = "github.com/iznilul/aliyun_rpc";

package arpc;

// Interface exported by the aliyun-service.
service AliyunRPC {
  // Send a templated SMS via dysmsapi SendSms.
  // Expects ao.Map: phoneNumbers, signName, templateCode, templateParam(map).
  rpc SendSms(RequestAO) returns (ResponseVO) {}

  // Generic Aliyun OpenAPI RPC-style call (CommonRequest).
  // Expects ao.Map: domain, version, apiAction, method, regionId, params(map).
  rpc DoCommonRequest(RequestAO) returns (ResponseVO) {}
}

message RequestAO {
  google.protobuf.Any data = 1;
  repeated google.protobuf.Any dataList = 2;
  google.protobuf.Any map = 3;
  repeated google.protobuf.Any mapList = 4;
}

message ResponseVO {
  int32 code = 1;
  string msg = 2;
  google.protobuf.Any data = 3;
  repeated google.protobuf.Any dataList = 4;
  google.protobuf.Any map = 5;
  repeated google.protobuf.Any mapList = 6;
}
